name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build Linux amd64
        working-directory: receiver
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o tempmail-linux-amd64 .

      - name: Build Linux arm64
        working-directory: receiver
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o tempmail-linux-arm64 .

      - name: Build Windows amd64
        working-directory: receiver
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o tempmail-windows-amd64.exe .

      - name: Create release archive
        run: |
          mkdir -p dist/linux
          cp receiver/tempmail-linux-amd64 dist/linux/
          cp receiver/tempmail-linux-arm64 dist/linux/
          cp receiver/tempmail-windows-amd64.exe dist/
          cp -r deploy dist/
          cp -r cloudflare-worker dist/
          cp .env.example dist/
          cp README.md dist/
          cd dist && tar czf ../tempmail-release.tar.gz .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tempmail-binaries
          path: |
            receiver/tempmail-linux-amd64
            receiver/tempmail-linux-arm64
            receiver/tempmail-windows-amd64.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: TempMail By JhopanStore ${{ github.ref_name }}
          body: |
            ## TempMail By JhopanStore ${{ github.ref_name }}

            ### Binaries
            - `tempmail-linux-amd64` — Linux x86_64 (Debian/Ubuntu/Armbian)
            - `tempmail-linux-arm64` — Linux ARM64 (Raspberry Pi 4/5)
            - `tempmail-windows-amd64.exe` — Windows x86_64

            ### Quick start
            ```bash
            # Download binary
            wget https://github.com/jhopan/TempMailByJhopanstore/releases/download/${{ github.ref_name }}/tempmail-linux-amd64

            # Install
            sudo bash deploy/linux/install.sh

            # Setup Cloudflare
            menutempmail → 8
            ```

            Credit JhopanStore
          files: |
            receiver/tempmail-linux-amd64
            receiver/tempmail-linux-arm64
            receiver/tempmail-windows-amd64.exe
            tempmail-release.tar.gz
