name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (falls back to the ref name)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: receiver/go.mod
          cache: true

      - name: Resolve asset names
        id: names
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ext=".exe"
          fi
          echo "stable=pan-tempmail-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" >> "$GITHUB_OUTPUT"
          echo "versioned=pan-tempmail-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        working-directory: receiver
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w" -o "../${{ steps.names.outputs.stable }}" .
          cp "../${{ steps.names.outputs.stable }}" "../${{ steps.names.outputs.versioned }}"

      - uses: actions/upload-artifact@v4
        with:
          name: pan-tempmail-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ steps.names.outputs.stable }}
            ${{ steps.names.outputs.versioned }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Source tarball
        run: |
          tar czf "pan-tempmail-${VERSION}.tar.gz" deploy cloudflare-worker .env.example README.md docs
          # Nama stabil: dipakai installer untuk mengunduh skrip tanpa tahu versinya.
          cp "pan-tempmail-${VERSION}.tar.gz" pan-tempmail.tar.gz

      - name: Checksums
        run: |
          stable="pan-tempmail-linux-amd64 pan-tempmail-linux-arm64 pan-tempmail-darwin-amd64 pan-tempmail-darwin-arm64 pan-tempmail-windows-amd64.exe"
          versioned=""
          for name in $stable; do
            versioned="$versioned ${name/pan-tempmail-/pan-tempmail-${VERSION}-}"
          done
          sha256sum $stable > pan-tempmail-checksums.txt
          sha256sum $versioned > "pan-tempmail-${VERSION}-checksums.txt"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Pan-TempMail ${{ env.VERSION }}
          body: |
            ## Pan-TempMail ${{ env.VERSION }}

            | Target | Stable asset | Versioned asset |
            | --- | --- | --- |
            | Linux x86_64 | `pan-tempmail-linux-amd64` | `pan-tempmail-${{ env.VERSION }}-linux-amd64` |
            | Linux ARM64 | `pan-tempmail-linux-arm64` | `pan-tempmail-${{ env.VERSION }}-linux-arm64` |
            | macOS Intel | `pan-tempmail-darwin-amd64` | `pan-tempmail-${{ env.VERSION }}-darwin-amd64` |
            | macOS Apple Silicon | `pan-tempmail-darwin-arm64` | `pan-tempmail-${{ env.VERSION }}-darwin-arm64` |
            | Windows x86_64 | `pan-tempmail-windows-amd64.exe` | `pan-tempmail-${{ env.VERSION }}-windows-amd64.exe` |

            Termux uses the Linux ARM64 build. macOS and Windows run in portable mode: the service
            adapters (launchd, Windows Service) are not implemented, so the installer prints the
            command to run instead of installing a service.

            The stable asset names are republished in every release, so
            https://github.com/jhopan/Pan-TempMail/releases/latest/download/pan-tempmail-linux-amd64
            always points at the newest build. The versioned copies and the checksums stay pinned to this tag.

            ```bash
            curl -fsSLO https://raw.githubusercontent.com/jhopan/Pan-TempMail/main/deploy/linux/install.sh
            sudo bash install.sh          # deteksi OS/arch, unduh biner latest, tanya port
            ```

            The installer detects Linux, Termux, macOS, or a Windows shell, downloads this release,
            asks for the port, and installs a systemd service on Linux (root) or a portable copy
            elsewhere. After it finishes, open the printed URL to create the first admin, then
            `/admin` to set up Cloudflare.

            Credit JhopanStore
          files: |
            pan-tempmail-linux-amd64
            pan-tempmail-linux-arm64
            pan-tempmail-darwin-amd64
            pan-tempmail-darwin-arm64
            pan-tempmail-windows-amd64.exe
            pan-tempmail-${{ env.VERSION }}-linux-amd64
            pan-tempmail-${{ env.VERSION }}-linux-arm64
            pan-tempmail-${{ env.VERSION }}-darwin-amd64
            pan-tempmail-${{ env.VERSION }}-darwin-arm64
            pan-tempmail-${{ env.VERSION }}-windows-amd64.exe
            pan-tempmail-checksums.txt
            pan-tempmail-${{ env.VERSION }}-checksums.txt
            pan-tempmail.tar.gz
            pan-tempmail-${{ env.VERSION }}.tar.gz
