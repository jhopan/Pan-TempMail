name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (falls back to the ref name)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: receiver/go.mod
          cache: true

      - name: Resolve asset names
        id: names
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ext=".exe"
          fi
          echo "stable=pan-tempmail-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" >> "$GITHUB_OUTPUT"
          echo "versioned=pan-tempmail-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        working-directory: receiver
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -ldflags="-s -w" -o "../${{ steps.names.outputs.stable }}" .
          cp "../${{ steps.names.outputs.stable }}" "../${{ steps.names.outputs.versioned }}"

      - uses: actions/upload-artifact@v4
        with:
          name: pan-tempmail-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ steps.names.outputs.stable }}
            ${{ steps.names.outputs.versioned }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Source tarball
        run: tar czf "pan-tempmail-${VERSION}.tar.gz" deploy cloudflare-worker .env.example README.md docs

      - name: Checksums
        run: |
          sha256sum pan-tempmail-linux-amd64 pan-tempmail-linux-arm64 pan-tempmail-windows-amd64.exe > pan-tempmail-checksums.txt
          sha256sum "pan-tempmail-${VERSION}-linux-amd64" "pan-tempmail-${VERSION}-linux-arm64" "pan-tempmail-${VERSION}-windows-amd64.exe" > "pan-tempmail-${VERSION}-checksums.txt"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Pan-TempMail ${{ env.VERSION }}
          body: |
            ## Pan-TempMail ${{ env.VERSION }}

            | Target | Stable asset | Versioned asset |
            | --- | --- | --- |
            | Linux x86_64 | `pan-tempmail-linux-amd64` | `pan-tempmail-${{ env.VERSION }}-linux-amd64` |
            | Linux ARM64 | `pan-tempmail-linux-arm64` | `pan-tempmail-${{ env.VERSION }}-linux-arm64` |
            | Windows x86_64 | `pan-tempmail-windows-amd64.exe` | `pan-tempmail-${{ env.VERSION }}-windows-amd64.exe` |

            The stable asset names are republished in every release, so
            https://github.com/jhopan/Pan-TempMail/releases/latest/download/pan-tempmail-linux-amd64
            always points at the newest build. The versioned copies and the checksums stay pinned to this tag.

            ```bash
            curl -LO https://github.com/jhopan/Pan-TempMail/releases/download/${{ env.VERSION }}/pan-tempmail-linux-amd64
            sudo bash deploy/linux/install.sh /path/to/pan-tempmail-linux-amd64
            ```

            After the install, open the printed URL and create the first admin account, then open `/admin` to set up Cloudflare.

            Credit JhopanStore
          files: |
            pan-tempmail-linux-amd64
            pan-tempmail-linux-arm64
            pan-tempmail-windows-amd64.exe
            pan-tempmail-${{ env.VERSION }}-linux-amd64
            pan-tempmail-${{ env.VERSION }}-linux-arm64
            pan-tempmail-${{ env.VERSION }}-windows-amd64.exe
            pan-tempmail-checksums.txt
            pan-tempmail-${{ env.VERSION }}-checksums.txt
            pan-tempmail-${{ env.VERSION }}.tar.gz
