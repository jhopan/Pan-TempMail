<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ TempMail By JhopanStore</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#0a0a0f;--surface:#12121a;--border:#1e1e2e;--text:#e2e8f0;
      --muted:#64748b;--brand:#8b5cf6;--brand-d:#7c3aed;
      --green:#22c55e;--yellow:#eab308;--red:#ef4444;--blue:#3b82f6;--radius:10px;
    }
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
    ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
    a{color:var(--blue);text-decoration:none}
    .topbar{display:flex;justify-content:space-between;align-items:center;
      padding:8px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
    .topbar-l{font-size:13px;color:var(--muted)}
    .topbar-l b{color:#fff}
    .btn-sm{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3);
      padding:4px 12px;border-radius:6px;font-size:13px;cursor:pointer;transition:.2s}
    .btn-sm:hover{background:rgba(239,68,68,.3)}
    .topbar-r{display:flex;gap:8px;align-items:center}
    .layout{display:flex;flex:1;overflow:hidden}
    .sidebar{width:300px;min-width:300px;border-right:1px solid var(--border);display:flex;flex-direction:column}
    .sb-head{padding:16px 16px 12px;border-bottom:1px solid var(--border)}
    .logo{font-size:17px;font-weight:700}.logo span{color:var(--brand)}
    .logo small{font-size:10px;color:var(--muted);font-weight:400}
    .sse{display:flex;align-items:center;gap:6px;margin-top:4px}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
    .dot-live{background:var(--green)}
    .dot-connecting{background:var(--muted)}
    .dot-reconnecting{background:var(--yellow);animation:dotPulse 1.4s ease-in-out infinite}
    @keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.35}}
    @media (prefers-reduced-motion:reduce){.dot-reconnecting{animation:none}}
    .sse-t{font-size:11px;color:var(--muted)}
    .sb-form{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
    input,select{background:var(--surface);border:1px solid var(--border);color:var(--text);
      padding:8px 10px;border-radius:8px;font-size:13px;width:100%;outline:none}
    input:focus,select:focus{border-color:var(--brand)}
    .btns{display:flex;gap:6px}
    .btn{flex:1;padding:8px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:.2s}
    .btn-p{background:var(--brand-d);color:#fff}.btn-p:hover{background:#6d28d9}
    .btn-s{background:#2a2a3a;color:var(--text)}.btn-s:hover{background:#33334a}
    .btn-s:disabled,.btn-p:disabled{opacity:.4;cursor:not-allowed}
    .email-box{background:var(--surface);border-radius:8px;padding:10px}
    .email-box .lbl{font-size:11px;color:var(--muted);margin-bottom:4px}
    .email-box .val{font-family:monospace;font-size:13px;color:var(--green);word-break:break-all;cursor:pointer}
    .email-box .val:hover{color:#4ade80}
    .email-box .cp{font-size:11px;color:var(--muted);margin-top:6px;cursor:pointer}
    .email-box .cp:hover{color:var(--text)}
    .msg-list{flex:1;overflow-y:auto}
    .msg-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:.15s}
    .msg-item:hover{background:rgba(255,255,255,.03)}
    .msg-item.active{background:rgba(139,92,246,.08)}
    .msg-item .from{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .msg-item .subj{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .msg-item .time{font-size:11px;color:var(--muted);float:right}
    .empty{text-align:center;padding:24px;color:var(--muted)}
    .empty .ico{font-size:28px;margin-bottom:6px}
    .empty .txt{font-size:13px}.empty .sub{font-size:11px;margin-top:4px}
    .sb-foot{padding:8px;text-align:center;font-size:11px;color:var(--muted);border-top:1px solid var(--border)}
    .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
    .msg-head{padding:16px 20px;border-bottom:1px solid var(--border)}
    .msg-head h2{font-size:18px;font-weight:700;margin-bottom:4px}
    .msg-head .from{font-size:13px;color:var(--muted)}
    .msg-body{flex:1;overflow-y:auto;padding:16px 20px}
    .msg-body pre{font-family:inherit;font-size:13px;line-height:1.6;color:var(--text);white-space:pre-wrap}
    .msg-body iframe{width:100%;border:none;min-height:calc(100vh - 160px);background:var(--bg)}
    .del-btn{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2);
      padding:5px 14px;border-radius:6px;font-size:12px;cursor:pointer;float:right}
    .del-btn:hover{background:rgba(239,68,68,.2)}
    .placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center}
    .placeholder .ico{font-size:36px;margin-bottom:8px}
    .placeholder .txt{font-size:15px}
    .att-area{padding:10px 20px;border-bottom:1px solid var(--border);background:var(--surface)}
    .att-area .lbl{font-size:11px;color:var(--muted);margin-bottom:6px}
    .att-list{display:flex;flex-wrap:wrap;gap:6px}
    .att-item{background:var(--border);border-radius:6px;padding:6px 10px;font-size:12px;display:flex;align-items:center;gap:4px;color:var(--text)}
    .att-item:hover{background:#2a2a3a}
    .footer-credit{text-align:center;padding:4px;font-size:10px;color:var(--muted);border-top:1px solid var(--border)}
    .footer-credit b{color:var(--brand)}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-l">⚡ Masuk sebagai <b id="userEmail">tidak diketahui</b></div>
    <div class="topbar-r">
      <button class="btn-sm" onclick="API.logout()">Keluar</button>
    </div>
  </div>
  <div class="layout">
    <div class="sidebar">
      <div class="sb-head">
        <div class="logo"><span>⚡</span> TempMail <small>By JhopanStore</small></div>
        <div class="sse">
          <span id="sseDot" class="dot dot-connecting"></span>
          <span id="sseText" class="sse-t">Menghubungkan...</span>
        </div>
      </div>
      <div class="sb-form">
        <input id="username" type="text" placeholder="Masukkan nama pengguna" class="cd-btn"
          onkeydown="if(event.key==='Enter'){changeEmail()}" />
        <select id="domain" class="cd-btn"></select>
        <div class="btns">
          <button id="changeBtn" class="btn btn-p cd-btn" onclick="changeEmail()">Ganti</button>
          <button id="randomBtn" class="btn btn-s cd-btn" onclick="randomEmail()">🎲 Acak</button>
        </div>
        <div class="email-box">
          <div class="lbl">Email Anda</div>
          <div id="currentEmail" class="val" onclick="copyEmail()">memuat...</div>
          <div id="copyBtn" class="cp" onclick="copyEmail()">📋 Salin</div>
        </div>
      </div>
      <div id="messageList" class="msg-list"></div>
      <div class="sb-foot"><span id="msgCount">0 pesan</span></div>
    </div>
    <div id="messageView" class="main"></div>
  </div>
  <div class="footer-credit"><b>TempMail By JhopanStore</b> — Credit JhopanStore</div>
  <script src="/app/app.js?v=9"></script>
  <script>
    const user = JSON.parse(localStorage.getItem('auth_user') || '{}');
    document.getElementById('userEmail').textContent = user.email || 'tidak diketahui';
    async function loadDomains() {
      try {
        const res = await fetch('/api/config');
        if (res.ok) {
          const cfg = await res.json();
          window.TEMPMAIL_DOMAINS = cfg.domains || ['example.com'];
        } else { window.TEMPMAIL_DOMAINS = ['example.com']; }
      } catch { window.TEMPMAIL_DOMAINS = ['example.com']; }
      const sel = document.getElementById('domain');
      const saved = localStorage.getItem('email_domain') || (window.TEMPMAIL_DOMAINS[0] || 'example.com');
      sel.innerHTML = window.TEMPMAIL_DOMAINS.map(d => `<option value="${d}" ${d === saved ? 'selected' : ''}>@${d}</option>`).join('');
      init();
    }
    loadDomains();
  </script>
</body>
</html>
