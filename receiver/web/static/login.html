<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — TempMail By JhopanStore</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#0a0a0f;--surface:#12121a;--border:#1e1e2e;--text:#e2e8f0;
      --muted:#64748b;--brand:#8b5cf6;--brand-d:#7c3aed;--red:#ef4444;--radius:10px;
    }
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
    .card{width:100%;max-width:360px;text-align:center}
    .logo{font-size:40px;margin-bottom:8px}
    h1{font-size:24px;font-weight:700}h1 small{font-size:12px;color:var(--muted);font-weight:400}
    .sub{color:var(--muted);font-size:13px;margin-top:6px;margin-bottom:24px}
    form{display:flex;flex-direction:column;gap:12px;text-align:left}
    label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
    input{background:var(--surface);border:1px solid var(--border);color:var(--text);
      padding:10px 12px;border-radius:8px;font-size:14px;width:100%;outline:none}
    input:focus{border-color:var(--brand)}
    .err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:var(--red);
      padding:8px 12px;border-radius:8px;font-size:13px;display:none}
    .btn{width:100%;padding:10px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;
      border:none;background:var(--brand-d);color:#fff;transition:.2s}
    .btn:hover{background:#6d28d9}
    .credit{margin-top:24px;font-size:11px;color:var(--muted)}
    .credit b{color:var(--brand)}
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">⚡</div>
    <h1>TempMail <small>By JhopanStore</small></h1>
    <p class="sub">Sign in to access your inbox</p>
    <form id="loginForm">
      <div>
        <label>Email</label>
        <input id="email" type="email" required placeholder="your@email.com" />
      </div>
      <div>
        <label>Password</label>
        <input id="password" type="password" required placeholder="••••••••" />
      </div>
      <div id="error" class="err"></div>
      <button type="submit" class="btn">Sign In</button>
    </form>
    <div class="credit"><b>TempMail By JhopanStore</b> — Credit JhopanStore</div>
  </div>
  <script>
    const token = localStorage.getItem('auth_token');
    if (token) window.location.href = '/app/';
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('error');
      errEl.style.display = 'none';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Login failed');
        }
        const data = await res.json();
        localStorage.setItem('auth_token', data.token);
        localStorage.setItem('auth_user', JSON.stringify(data.user));
        window.location.href = '/app/';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
